name: Render and Upload Short

# Needed so the "Cleanup narration audio from repo" step at the end can
# push a commit that deletes the temp audio file.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: 'Path (inside this repo) to the narration audio, e.g. narration-temp/1234-ab12.mp3. n8n must commit+push this file BEFORE dispatching this workflow.'
        required: true
      media_type:
        description: 'image or video'
        required: true
        default: 'image'
      media_urls:
        description: 'JSON array of media URLs, e.g. ["https://...","https://..."]'
        required: true
      caption_text:
        description: 'Narration script (kept for reference only - no longer burned into the video as captions)'
        required: false
        default: ''
      video_title:
        description: 'YouTube video title (SEO)'
        required: true
      video_description:
        description: 'YouTube video description (SEO)'
        required: false
        default: ''
      video_tags:
        description: 'Comma separated tags (no # symbol)'
        required: false
        default: 'news,uk'
      hashtags_text:
        description: 'Hashtags with # symbol, space separated, appended to description'
        required: false
        default: '#news #uk'
      privacy_status:
        description: 'YouTube privacy status (private/unlisted/public)'
        required: false
        default: 'private'

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so the cleanup
          # step at the end of this job can safely commit + push without
          # git complaining about a shallow repo.
          fetch-depth: 0

      - name: Install fonts and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core ffmpeg jq

      # ------------------------------------------------------------------
      # OLD APPROACH (removed): curl-download narration.mp3 from a
      # Cloudinary URL, with retries + a 10s "CDN propagation" wait. This
      # was fundamentally racy: Cloudinary is a temporary/expiring store,
      # and if the runner was queued/delayed past the file's lifetime, the
      # download would come back HTTP 200 with garbage/empty content
      # (invalid audio) - which is exactly what failed in run #70.
      #
      # NEW APPROACH: n8n commits the narration file directly into this
      # repo (path given via the audio_path input) and pushes it BEFORE
      # dispatching this workflow. Because "Checkout repo" above pulls
      # whatever is on the branch at trigger time, the file is already
      # sitting on disk the moment this job starts - no network fetch, no
      # expiry window, no race, regardless of how long the runner was
      # queued.
      # ------------------------------------------------------------------
      - name: Validate narration audio (from repo)
        env:
          AUDIO_PATH: ${{ github.event.inputs.audio_path }}
        run: |
          if [ -z "$AUDIO_PATH" ]; then
            echo "::error::No audio_path provided."
            exit 1
          fi

          if [ ! -f "$AUDIO_PATH" ]; then
            echo "::error::Expected narration file at '$AUDIO_PATH' but it was not found in the checked-out repo."
            echo "::error::Did n8n actually commit+push it to this branch BEFORE calling the workflow_dispatch API?"
            echo "Repo contents of narration-temp/ (if it exists):"
            ls -la narration-temp/ 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          fi

          cp "$AUDIO_PATH" narration.mp3

          if ! ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.mp3 >/dev/null 2>&1; then
            echo "::error::'$AUDIO_PATH' was found but is not a valid audio file (first 300 bytes below). It may have been corrupted during the base64 commit step in n8n."
            head -c 300 narration.mp3
            echo ""
            exit 1
          fi

          echo "Narration audio OK ($(du -h narration.mp3 | cut -f1)) from $AUDIO_PATH"

      - name: Save media URL list to file
        run: |
          cat > media.json << 'MEDEOF'
          ${{ github.event.inputs.media_urls }}
          MEDEOF

      - name: Download all media
        env:
          MEDIA_TYPE: ${{ github.event.inputs.media_type }}
        run: |
          mkdir -p media
          i=0

          if [ "$MEDIA_TYPE" = "video" ]; then
            EXT="mp4"
          else
            EXT="jpg"
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          while IFS= read -r url; do
            i=$((i+1))
            n=$(printf '%03d' "$i")
            echo "Downloading media $n: $url"
            http_code=$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" \
              -o "media/item_${n}.${EXT}" -w "%{http_code}" "$url" || echo "000")
            if [ "$http_code" != "200" ]; then
              echo "  FAILED (HTTP $http_code) - skipping media $n"
              rm -f "media/item_${n}.${EXT}"
            fi
          done < <(jq -r '.[]' media.json)

          find media -type f -empty -delete

          COUNT=$(ls media/item_*.${EXT} 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::ALL media downloads failed - falling back to an UNRELATED random placeholder image. Check the HTTP codes logged above."
            curl -L -A "$UA" "https://picsum.photos/1080/1920" -o media/item_001.jpg
            MEDIA_TYPE="image"
            COUNT=1
          fi

          echo "MEDIA_TYPE=$MEDIA_TYPE" >> "$GITHUB_ENV"
          echo "MEDIA_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "Downloaded $COUNT ${MEDIA_TYPE} file(s)"

      # ------------------------------------------------------------------
      # Channel is landscape long-form only now (3-8 min videos, no more
      # Shorts) - always render at 1920x1080, no orientation detection
      # needed.
      # ------------------------------------------------------------------
      - name: Set landscape render target
        run: |
          echo "TARGET_W=1920" >> "$GITHUB_ENV"
          echo "TARGET_H=1080" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Build one clip per media item at the orientation-correct resolution.
      # Images get a slow Ken Burns zoom/pan instead of sitting static.
      # ------------------------------------------------------------------
      - name: Build media segments
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.mp3)
          PER_ITEM=$(awk "BEGIN { printf \"%.3f\", $DURATION / $MEDIA_COUNT }")
          FPS=30
          FRAMES=$(awk "BEGIN { printf \"%d\", $PER_ITEM * $FPS }")
          echo "Audio duration: ${DURATION}s across $MEDIA_COUNT ${MEDIA_TYPE} item(s) = ${PER_ITEM}s (${FRAMES} frames) each"

          mkdir -p segments
          i=0

          if [ "$MEDIA_TYPE" = "video" ]; then
            for f in media/item_*.mp4; do
              i=$((i+1))
              n=$(printf '%03d' "$i")
              ffmpeg -y -stream_loop -1 -i "$f" -t "$PER_ITEM" \
                -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=increase,crop=${TARGET_W}:${TARGET_H}" \
                -c:v libx264 -pix_fmt yuv420p -r $FPS -an "segments/seg_${n}.mp4"
            done
          else
            # Oversample 2x before zoompan so the zoom doesn't look pixelated,
            # then zoompan does a slow continuous zoom-in (Ken Burns effect).
            OS_W=$((TARGET_W*2))
            OS_H=$((TARGET_H*2))
            for f in media/item_*.jpg; do
              i=$((i+1))
              n=$(printf '%03d' "$i")
              ffmpeg -y -loop 1 -i "$f" -t "$PER_ITEM" \
                -vf "scale=${OS_W}:${OS_H}:force_original_aspect_ratio=increase,crop=${OS_W}:${OS_H},zoompan=z='min(zoom+0.0015,1.3)':d=${FRAMES}:s=${TARGET_W}x${TARGET_H}:fps=${FPS},format=yuv420p" \
                -c:v libx264 -pix_fmt yuv420p -r $FPS "segments/seg_${n}.mp4"
            done
          fi

      # ------------------------------------------------------------------
      # Replace the old hard-cut concat with crossfade transitions between
      # slides ("slide animation") using ffmpeg's xfade filter, chained
      # across however many segments we ended up with.
      # ------------------------------------------------------------------
      - name: Build transition script
        run: |
          cat > build_slideshow.py << 'PYEOF'
          import subprocess, sys, glob

          def probe_duration(path):
              out = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", path
              ]).decode().strip()
              return float(out)

          segments = sorted(glob.glob("segments/seg_*.mp4"))
          if not segments:
              print("No segments found"); sys.exit(1)

          if len(segments) == 1:
              subprocess.run(["cp", segments[0], "slideshow.mp4"], check=True)
              sys.exit(0)

          TRANSITIONS = ["fade", "wipeleft", "wiperight", "slideup", "slidedown",
                         "circleopen", "circleclose", "smoothleft", "smoothright", "distance"]
          XFADE_DUR = 0.6

          durations = [probe_duration(s) for s in segments]

          inputs = []
          for s in segments:
              inputs += ["-i", s]

          filter_parts = []
          prev_label = "0:v"
          cumulative = durations[0]

          for i in range(1, len(segments)):
              d = max(0.1, min(XFADE_DUR, durations[i - 1], durations[i]))
              offset = max(0.0, cumulative - d)
              transition = TRANSITIONS[(i - 1) % len(TRANSITIONS)]
              out_label = f"v{i}" if i < len(segments) - 1 else "vout"
              filter_parts.append(
                  f"[{prev_label}][{i}:v]xfade=transition={transition}:duration={d:.3f}:offset={offset:.3f}[{out_label}]"
              )
              cumulative = cumulative + durations[i] - d
              prev_label = out_label

          filter_complex = ";".join(filter_parts)

          cmd = ["ffmpeg", "-y"] + inputs + [
              "-filter_complex", filter_complex,
              "-map", f"[{prev_label}]",
              "-c:v", "libx264", "-pix_fmt", "yuv420p", "-r", "30",
              "slideshow.mp4",
          ]
          print("Running:", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PYEOF

      - name: Render slideshow with crossfade transitions
        run: python3 build_slideshow.py

      - name: Add narration (no burned-in captions)
        run: |
          ffmpeg -y -i slideshow.mp4 -i narration.mp3 \
            -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest output.mp4

      - name: Prepare title file (for thumbnail)
        run: |
          cat > title.txt << 'TITLEEOF'
          ${{ github.event.inputs.video_title }}
          TITLEEOF

      - name: Generate thumbnail
        run: |
          # Grab the frame from ~15% into the video rather than a fixed 1s -
          # avoids landing on a black frame or mid-crossfade transition,
          # while still changing per topic since each video's content differs.
          SLIDE_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 slideshow.mp4)
          THUMB_TS=$(awk "BEGIN { printf \"%.2f\", $SLIDE_DURATION * 0.15 }")
          echo "Grabbing thumbnail frame at ${THUMB_TS}s of ${SLIDE_DURATION}s"

          ffmpeg -y -ss "$THUMB_TS" -i slideshow.mp4 -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,drawtext=textfile=title.txt:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontcolor=white:fontsize=64:box=1:boxcolor=black@0.5:boxborderw=24:shadowcolor=black@0.7:shadowx=3:shadowy=3:x=(w-text_w)/2:y=(h-text_h)/2:line_spacing=12" \
            thumbnail.jpg

      - name: Check video duration is in the 3-8 minute range
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output.mp4)
          MIN=$(awk "BEGIN { print ($DUR >= 180) ? 1 : 0 }")
          MAX=$(awk "BEGIN { print ($DUR <= 480) ? 1 : 0 }")
          echo "Final video duration: ${DUR}s"
          if [ "$MIN" -eq 0 ] || [ "$MAX" -eq 0 ]; then
            echo "::warning::Video duration ${DUR}s is outside the target 180-480s (3-8 min) range - script length from n8n may need adjusting."
          fi

      - name: Upload to YouTube
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          VIDEO_DESCRIPTION: ${{ github.event.inputs.video_description }}
          VIDEO_TAGS: ${{ github.event.inputs.video_tags }}
          HASHTAGS_TEXT: ${{ github.event.inputs.hashtags_text }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status }}
        run: |
          pip install --quiet google-auth google-auth-oauthlib google-api-python-client
          python3 upload_youtube.py

      # ------------------------------------------------------------------
      # Remove the temp narration file from the repo now that the video
      # has been uploaded (runs even if an earlier step failed, so we
      # don't leave orphaned audio files behind on failed runs either).
      #
      # This pushes a small commit deleting the one file - it does NOT
      # rewrite git history, so the blob technically still exists in past
      # commits. For small TTS audio files at a few-videos-per-day
      # cadence this is not a practical problem, but if repo size ever
      # becomes a concern, periodically run `git gc` / BFG Repo-Cleaner,
      # or switch narration-temp/ to a short-lived orphan branch instead
      # of main.
      # ------------------------------------------------------------------
      - name: Cleanup narration audio from repo
        if: always()
        env:
          AUDIO_PATH: ${{ github.event.inputs.audio_path }}
        run: |
          if [ -z "$AUDIO_PATH" ] || [ ! -f "$AUDIO_PATH" ]; then
            echo "Nothing to clean up at '$AUDIO_PATH'."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ github.ref_name }}"
          git rm -f "$AUDIO_PATH"
          git commit -m "chore: remove processed narration audio ($AUDIO_PATH) [skip ci]"

          # Other renders may finish around the same time and push their
          # own cleanup commits to the same branch - retry with rebase on
          # conflict instead of failing the whole (already-successful) run.
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Cleanup pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt $i) - fetching and rebasing, then retrying..."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}" || { git rebase --abort; break; }
            sleep 3
          done
          echo "::warning::Could not push cleanup commit for $AUDIO_PATH after 3 attempts. The temp file will remain in the repo until manually removed or cleaned up by a later run."

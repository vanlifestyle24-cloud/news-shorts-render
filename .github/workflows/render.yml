name: Render and Upload Short

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL of narration audio (mp3/wav)'
        required: true
      media_type:
        description: 'image or video'
        required: true
        default: 'image'
      media_urls:
        description: 'JSON array of media URLs, e.g. ["https://...","https://..."]'
        required: true
      caption_text:
        description: 'Text to overlay as captions on the video'
        required: true
      video_title:
        description: 'YouTube video title (SEO)'
        required: true
      video_description:
        description: 'YouTube video description (SEO)'
        required: false
        default: ''
      video_tags:
        description: 'Comma separated tags (no # symbol)'
        required: false
        default: 'news,shorts,uk'
      hashtags_text:
        description: 'Hashtags with # symbol, space separated, appended to description'
        required: false
        default: '#news #uk #shorts'
      privacy_status:
        description: 'YouTube privacy status (private/unlisted/public)'
        required: false
        default: 'private'

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install fonts and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core ffmpeg jq

      - name: Download narration audio
        run: |
          http_code=$(curl -L -sS --retry 3 --retry-delay 3 --retry-connrefused \
            -o narration.mp3 -w "%{http_code}" "${{ github.event.inputs.audio_url }}" || echo "000")
          echo "Narration download HTTP status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Could not download narration audio from ${{ github.event.inputs.audio_url }} (HTTP $http_code). Is the edge-tts server up and reachable from the internet (not just your local network)?"
            exit 1
          fi

          if ! ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.mp3 >/dev/null 2>&1; then
            echo "::error::Downloaded narration.mp3 is not a valid audio file. First 300 bytes of what we got:"
            head -c 300 narration.mp3
            echo ""
            exit 1
          fi

          echo "Narration audio OK ($(du -h narration.mp3 | cut -f1))"

      - name: Save media URL list to file
        run: |
          cat > media.json << 'MEDEOF'
          ${{ github.event.inputs.media_urls }}
          MEDEOF

      - name: Download all media
        env:
          MEDIA_TYPE: ${{ github.event.inputs.media_type }}
        run: |
          mkdir -p media
          i=0

          if [ "$MEDIA_TYPE" = "video" ]; then
            EXT="mp4"
          else
            EXT="jpg"
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          while IFS= read -r url; do
            i=$((i+1))
            n=$(printf '%03d' "$i")
            echo "Downloading media $n: $url"
            http_code=$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" \
              -o "media/item_${n}.${EXT}" -w "%{http_code}" "$url" || echo "000")
            if [ "$http_code" != "200" ]; then
              echo "  FAILED (HTTP $http_code) - skipping media $n"
              rm -f "media/item_${n}.${EXT}"
            fi
          done < <(jq -r '.[]' media.json)

          find media -type f -empty -delete

          COUNT=$(ls media/item_*.${EXT} 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::ALL media downloads failed - falling back to an UNRELATED random placeholder image. Check the HTTP codes logged above."
            curl -L -A "$UA" "https://picsum.photos/1080/1920" -o media/item_001.jpg
            MEDIA_TYPE="image"
            COUNT=1
          fi

          echo "MEDIA_TYPE=$MEDIA_TYPE" >> "$GITHUB_ENV"
          echo "MEDIA_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "Downloaded $COUNT ${MEDIA_TYPE} file(s)"

      # ------------------------------------------------------------------
      # NEW: figure out whether the source media is landscape or vertical,
      # and pick the render target + Shorts/normal-video decision from that.
      # Landscape source -> rendered landscape (1920x1080) -> normal video.
      # Vertical/portrait source -> rendered vertical (1080x1920) -> Short.
      # ------------------------------------------------------------------
      - name: Detect media orientation
        run: |
          if [ "$MEDIA_TYPE" = "video" ]; then
            SAMPLE=$(ls media/item_*.mp4 | head -n 1)
          else
            SAMPLE=$(ls media/item_*.jpg | head -n 1)
          fi

          DIMENSIONS=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=s=x:p=0 "$SAMPLE")
          WIDTH=$(echo "$DIMENSIONS" | cut -d'x' -f1)
          HEIGHT=$(echo "$DIMENSIONS" | cut -d'x' -f2)
          echo "Sample media: $SAMPLE (${WIDTH}x${HEIGHT})"

          if [ "$HEIGHT" -ge "$WIDTH" ]; then
            ORIENTATION="portrait"
            TARGET_W=1080
            TARGET_H=1920
            IS_SHORT="true"
          else
            ORIENTATION="landscape"
            TARGET_W=1920
            TARGET_H=1080
            IS_SHORT="false"
          fi

          echo "Orientation: $ORIENTATION -> render ${TARGET_W}x${TARGET_H}, IS_SHORT=$IS_SHORT"
          echo "ORIENTATION=$ORIENTATION" >> "$GITHUB_ENV"
          echo "TARGET_W=$TARGET_W" >> "$GITHUB_ENV"
          echo "TARGET_H=$TARGET_H" >> "$GITHUB_ENV"
          echo "IS_SHORT=$IS_SHORT" >> "$GITHUB_ENV"

      - name: Prepare caption file
        run: |
          cat > caption.txt << 'CAPEOF'
          ${{ github.event.inputs.caption_text }}
          CAPEOF

      # ------------------------------------------------------------------
      # Build one clip per media item at the orientation-correct resolution.
      # Images get a slow Ken Burns zoom/pan instead of sitting static.
      # ------------------------------------------------------------------
      - name: Build media segments
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.mp3)
          PER_ITEM=$(awk "BEGIN { printf \"%.3f\", $DURATION / $MEDIA_COUNT }")
          FPS=30
          FRAMES=$(awk "BEGIN { printf \"%d\", $PER_ITEM * $FPS }")
          echo "Audio duration: ${DURATION}s across $MEDIA_COUNT ${MEDIA_TYPE} item(s) = ${PER_ITEM}s (${FRAMES} frames) each"

          mkdir -p segments
          i=0

          if [ "$MEDIA_TYPE" = "video" ]; then
            for f in media/item_*.mp4; do
              i=$((i+1))
              n=$(printf '%03d' "$i")
              ffmpeg -y -stream_loop -1 -i "$f" -t "$PER_ITEM" \
                -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=increase,crop=${TARGET_W}:${TARGET_H}" \
                -c:v libx264 -pix_fmt yuv420p -r $FPS -an "segments/seg_${n}.mp4"
            done
          else
            # Oversample 2x before zoompan so the zoom doesn't look pixelated,
            # then zoompan does a slow continuous zoom-in (Ken Burns effect).
            OS_W=$((TARGET_W*2))
            OS_H=$((TARGET_H*2))
            for f in media/item_*.jpg; do
              i=$((i+1))
              n=$(printf '%03d' "$i")
              ffmpeg -y -loop 1 -i "$f" -t "$PER_ITEM" \
                -vf "scale=${OS_W}:${OS_H}:force_original_aspect_ratio=increase,crop=${OS_W}:${OS_H},zoompan=z='min(zoom+0.0015,1.3)':d=${FRAMES}:s=${TARGET_W}x${TARGET_H}:fps=${FPS},format=yuv420p" \
                -c:v libx264 -pix_fmt yuv420p -r $FPS "segments/seg_${n}.mp4"
            done
          fi

      # ------------------------------------------------------------------
      # Replace the old hard-cut concat with crossfade transitions between
      # slides ("slide animation") using ffmpeg's xfade filter, chained
      # across however many segments we ended up with.
      # ------------------------------------------------------------------
      - name: Build transition script
        run: |
          cat > build_slideshow.py << 'PYEOF'
          import subprocess, sys, glob

          def probe_duration(path):
              out = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", path
              ]).decode().strip()
              return float(out)

          segments = sorted(glob.glob("segments/seg_*.mp4"))
          if not segments:
              print("No segments found"); sys.exit(1)

          if len(segments) == 1:
              subprocess.run(["cp", segments[0], "slideshow.mp4"], check=True)
              sys.exit(0)

          TRANSITIONS = ["fade", "wipeleft", "wiperight", "slideup", "slidedown",
                         "circleopen", "circleclose", "smoothleft", "smoothright", "distance"]
          XFADE_DUR = 0.6

          durations = [probe_duration(s) for s in segments]

          inputs = []
          for s in segments:
              inputs += ["-i", s]

          filter_parts = []
          prev_label = "0:v"
          cumulative = durations[0]

          for i in range(1, len(segments)):
              d = max(0.1, min(XFADE_DUR, durations[i - 1], durations[i]))
              offset = max(0.0, cumulative - d)
              transition = TRANSITIONS[(i - 1) % len(TRANSITIONS)]
              out_label = f"v{i}" if i < len(segments) - 1 else "vout"
              filter_parts.append(
                  f"[{prev_label}][{i}:v]xfade=transition={transition}:duration={d:.3f}:offset={offset:.3f}[{out_label}]"
              )
              cumulative = cumulative + durations[i] - d
              prev_label = out_label

          filter_complex = ";".join(filter_parts)

          cmd = ["ffmpeg", "-y"] + inputs + [
              "-filter_complex", filter_complex,
              "-map", f"[{prev_label}]",
              "-c:v", "libx264", "-pix_fmt", "yuv420p", "-r", "30",
              "slideshow.mp4",
          ]
          print("Running:", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PYEOF

      - name: Render slideshow with crossfade transitions
        run: python3 build_slideshow.py

      - name: Add narration and captions
        run: |
          CAPTION_Y="h*0.78"
          ffmpeg -y -i slideshow.mp4 -i narration.mp3 \
            -vf "drawtext=textfile=caption.txt:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontcolor=white:fontsize=50:box=1:boxcolor=black@0.55:boxborderw=22:shadowcolor=black@0.6:shadowx=2:shadowy=2:x=(w-text_w)/2:y=${CAPTION_Y}:line_spacing=14" \
            -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest output.mp4

      - name: Prepare title file (for thumbnail)
        run: |
          cat > title.txt << 'TITLEEOF'
          ${{ github.event.inputs.video_title }}
          TITLEEOF

      - name: Generate thumbnail
        run: |
          ffmpeg -y -ss 1 -i slideshow.mp4 -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,drawtext=textfile=title.txt:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontcolor=white:fontsize=64:box=1:boxcolor=black@0.5:boxborderw=24:shadowcolor=black@0.7:shadowx=3:shadowy=3:x=(w-text_w)/2:y=(h-text_h)/2:line_spacing=12" \
            thumbnail.jpg

      - name: Upload to YouTube
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          VIDEO_DESCRIPTION: ${{ github.event.inputs.video_description }}
          VIDEO_TAGS: ${{ github.event.inputs.video_tags }}
          HASHTAGS_TEXT: ${{ github.event.inputs.hashtags_text }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status }}
          ORIENTATION: ${{ env.ORIENTATION }}
          IS_SHORT: ${{ env.IS_SHORT }}
        run: |
          pip install --quiet google-auth google-auth-oauthlib google-api-python-client
          python3 upload_youtube.py

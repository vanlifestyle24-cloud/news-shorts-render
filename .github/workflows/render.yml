name: Render and Upload Short

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL of narration audio (mp3/wav)'
        required: true
      image_urls:
        description: 'JSON array of image URLs, e.g. ["https://...","https://..."]'
        required: true
      caption_text:
        description: 'Text to overlay as captions on the video'
        required: true
      video_title:
        description: 'YouTube video title (SEO)'
        required: true
      video_description:
        description: 'YouTube video description (SEO)'
        required: false
        default: ''
      video_tags:
        description: 'Comma separated tags (no # symbol)'
        required: false
        default: 'news,shorts,uk'
      hashtags_text:
        description: 'Hashtags with # symbol, space separated, appended to description'
        required: false
        default: '#news #uk #shorts'
      privacy_status:
        description: 'YouTube privacy status (private/unlisted/public)'
        required: false
        default: 'private'

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install fonts and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core ffmpeg jq

      - name: Download narration audio
        run: curl -L "${{ github.event.inputs.audio_url }}" -o narration.mp3

      - name: Save image URL list to file
        run: |
          cat > images.json << 'IMGEOF'
          ${{ github.event.inputs.image_urls }}
          IMGEOF

      - name: Download all images
        run: |
          mkdir -p images
          i=0
          while IFS= read -r url; do
            i=$((i+1))
            n=$(printf '%03d' "$i")
            echo "Downloading image $n: $url"
            curl -L -f -s "$url" -o "images/img_${n}.jpg" || echo "  (failed, skipping)"
          done < <(jq -r '.[]' images.json)

          # remove any empty/failed downloads
          find images -type f -empty -delete

          COUNT=$(ls images/*.jpg 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No images downloaded successfully, using a fallback image"
            curl -L "https://picsum.photos/1080/1920" -o images/img_001.jpg
            COUNT=1
          fi
          echo "IMAGE_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "Downloaded $COUNT image(s)"

      - name: Prepare caption file
        run: |
          cat > caption.txt << 'CAPEOF'
          ${{ github.event.inputs.caption_text }}
          CAPEOF

      - name: Prepare title file (for thumbnail)
        run: |
          cat > title.txt << 'TITLEEOF'
          ${{ github.event.inputs.video_title }}
          TITLEEOF

      - name: Build image slideshow segments
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.mp3)
          PER_IMAGE=$(awk "BEGIN { printf \"%.3f\", $DURATION / $IMAGE_COUNT }")
          echo "Audio duration: ${DURATION}s across $IMAGE_COUNT image(s) = ${PER_IMAGE}s each"

          mkdir -p segments
          i=0
          for img in images/*.jpg; do
            i=$((i+1))
            n=$(printf '%03d' "$i")
            ffmpeg -y -loop 1 -i "$img" -t "$PER_IMAGE" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -c:v libx264 -pix_fmt yuv420p -r 30 "segments/seg_${n}.mp4"
          done

          for f in segments/seg_*.mp4; do echo "file '$f'"; done > concat_list.txt

      - name: Concatenate slideshow
        run: ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy slideshow.mp4

      - name: Add narration and captions
        run: |
          ffmpeg -y -i slideshow.mp4 -i narration.mp3 \
            -vf "drawtext=textfile=caption.txt:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontcolor=white:fontsize=50:box=1:boxcolor=black@0.55:boxborderw=22:shadowcolor=black@0.6:shadowx=2:shadowy=2:x=(w-text_w)/2:y=h-440:line_spacing=14" \
            -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest output.mp4

      - name: Generate thumbnail
        run: |
          ffmpeg -y -i images/img_001.jpg \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,drawtext=textfile=title.txt:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontcolor=white:fontsize=64:box=1:boxcolor=black@0.5:boxborderw=24:shadowcolor=black@0.7:shadowx=3:shadowy=3:x=(w-text_w)/2:y=(h-text_h)/2:line_spacing=12" \
            thumbnail.jpg

      - name: Upload to YouTube
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          VIDEO_DESCRIPTION: ${{ github.event.inputs.video_description }}
          VIDEO_TAGS: ${{ github.event.inputs.video_tags }}
          HASHTAGS_TEXT: ${{ github.event.inputs.hashtags_text }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status }}
        run: |
          pip install --quiet google-auth google-auth-oauthlib google-api-python-client
          python3 upload_youtube.py
